# Render blueprint: the API twice, a staging copy that deploys from the `staging` branch and production that deploys from `main`.
# Nothing here is applied until you create a Blueprint in Render from this file. Values marked sync:false are typed in the Render dashboard, never kept in git.
services:
  - type: web
    name: campusio-api
    runtime: node
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /ready
    autoDeploy: true
    envVars: &env
      - { key: NODE_ENV, value: production }
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: JWT_SECRET_PREVIOUS, sync: false }
      - { key: DATA_KEY, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: APP_URL, sync: false }
      - { key: ALERT_WEBHOOK_URL, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: PAYMENT_PROVIDER, value: "off" }
      # uploaded files: set all four to keep them in a private Cloudflare R2 bucket instead of the database (see docs/OPERATIONS.md)
      - { key: R2_ACCOUNT_ID, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
  - type: web
    name: campusio-api-staging
    runtime: node
    branch: staging
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /ready
    autoDeploy: true
    envVars: *env
